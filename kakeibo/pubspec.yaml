name: kakeibo
description: 支出管理アプリ
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1 # Isarネイティブライブラリ（全プラットフォーム対応）
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  path_provider: ^2.1.3 # Isar初期化時のDBパス取得用
  crypto: ^3.0.3 # パスコードのPBKDF2-SHA256ハッシュ用

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
