<!-- Android 7 以前の旧形式のアイコン・Windows のアイコン・アプリ内（家計簿について）に出すアイコン。角丸の背景込み。背景は background.svg、前景は foreground.svg と同じ絵柄を少し大きくしたもの -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="base" x1="4" y1="4" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F8E8"/>
    </linearGradient>
    <linearGradient id="cover" x1="32" y1="29" x2="68" y2="79" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEF8D6"/>
      <stop offset="1" stop-color="#C5E39A"/>
    </linearGradient>
    <linearGradient id="coin" x1="56" y1="54" x2="82" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#F6A609"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="100" height="100" rx="24" fill="url(#base)" stroke="#D5E3C0" stroke-width="1.5"/> <!-- 白い画面の上でも形がわかるよう、淡い縁取りを付ける -->
  <g transform="translate(54 54) scale(1.3) translate(-54 -54)">
    <rect x="35" y="33" width="36" height="50" rx="6" fill="#33691E" fill-opacity="0.16"/>
    <rect x="35" y="31" width="35" height="50" rx="5" fill="#FFFFFF" stroke="#C9DDA8" stroke-width="1.2"/>
    <rect x="32" y="29" width="36" height="50" rx="6" fill="url(#cover)" stroke="#9CC566" stroke-width="1.2"/>
    <path d="M38 29 H40 V79 H38 Q32 79 32 73 V35 Q32 29 38 29 Z" fill="#9CCC65"/>
    <rect x="45" y="37" width="18" height="13" rx="2.5" fill="#FFFFFF"/>
    <g stroke="#8BC34A" stroke-width="2" stroke-linecap="round">
      <line x1="48.5" y1="41.5" x2="59.5" y2="41.5"/>
