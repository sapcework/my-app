<!-- テーマアイコン用（Android 13 以降）。形だけが使われ、色は端末が壁紙に合わせて塗る -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- 金貨のまわりを削って、ノートと金貨の境目を見せる -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <rect width="108" height="108" fill="#FFFFFF"/>
      <circle cx="69" cy="67" r="16.5" fill="#000000"/>
    </mask>
    <!-- 金貨を塗りつぶし、¥ の形をくり抜く -->
    <mask id="yen" maskUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <circle cx="69" cy="67" r="13" fill="#FFFFFF"/>
      <g stroke="#000000" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M63.8 60.2 L69 66.4 L74.2 60.2"/>
        <line x1="69" y1="66.4" x2="69" y2="74.2"/>
        <line x1="64.8" y1="67.6" x2="73.2" y2="67.6"/>
        <line x1="64.8" y1="71.2" x2="73.2" y2="71.2"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#gap)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="32" y="29" width="36" height="50" rx="6"/>
    <line x1="40" y1="29" x2="40" y2="79"/>
    <rect x="46" y="38" width="16" height="11" rx="2"/>
  </g>
  <rect width="108" height="108" fill="#FFFFFF" mask="url(#yen)"/>
</svg>
