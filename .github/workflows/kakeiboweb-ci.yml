name: kakeiboWeb CI

on:
  push:
    branches: [master]
    paths: ['kakeiboWeb/**']
  pull_request:
    paths: ['kakeiboWeb/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kakeiboWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kakeiboWeb/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
