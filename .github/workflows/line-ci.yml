name: line CI

on:
  push:
    branches: [master]
    paths: ['line/**']
  pull_request:
    paths: ['line/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: line/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
