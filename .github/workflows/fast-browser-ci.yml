name: fast-browser CI

on:
  push:
    branches: [master]
    paths: ['fast-browser/**', '.github/workflows/fast-browser-ci.yml']
  pull_request:
    paths: ['fast-browser/**', '.github/workflows/fast-browser-ci.yml']

# 同じブランチで新しい push があれば古い実行は打ち切る（Windows ランナーは高価なため）
concurrency:
  group: fast-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # WebView2 と MSVC ツールチェーンに依存するため Windows で検証する
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fast-browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fast-browser/package-lock.json

      - name: Rust ツールチェーンを準備
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Rust のビルドは重いので target/ をキャッシュする
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fast-browser/src-tauri

      - run: npm ci

      - name: 依存の脆弱性チェック
        run: npm audit --audit-level=high

      - name: 型チェック
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: フォーマット確認（TS/CSS）
        run: npm run format:check

      - name: フォーマット確認（Rust）
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: フロントエンドのテスト
        run: npm test

      - name: clippy（警告ゼロ必須）
        run: npm run lint:rust

      - name: Rust のテスト
        run: npm run test:rust

      - name: 本番ビルドが通ることを確認
        run: npm run build
