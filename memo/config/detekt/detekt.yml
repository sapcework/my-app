# 既定ルール（buildUponDefaultConfig = true）に対する差分のみを記述する
build:
  maxIssues: 0

complexity:
  LongMethod:
    # Composableは宣言的なUIツリーであり、行数が複雑度の指標にならない。
    # 分岐やロジックの複雑さは CyclomaticComplexMethod / CognitiveComplexMethod が引き続き見張る。
    # 肥大したComposableの分割は、行数ではなく責務を基準にレビューで判断する。
    ignoreAnnotated: ['Composable']
  LongParameterList:
    # Composable関数は引数が多くなりやすいため緩和
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 20
    # DAOは本質的にクエリの集合で、分割すると凝集度がむしろ下がるため緩和
    thresholdInInterfaces: 25
    ignorePrivate: true

style:
  MagicNumber:
    # Magic Number禁止方針の中核ルール。テストとComposeプレビューのみ除外
    excludes: ['**/test/**', '**/androidTest/**']
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenComment:
    # TODOはStep進行中に使うため、コミット前レビューで個別に潰す方針
    active: false

naming:
  FunctionNaming:
    # @ComposableはPascalCaseが公式規約
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
    propertyPattern: '[a-z][A-Za-z0-9]*'
    privatePropertyPattern: '[A-Za-z][_A-Za-z0-9]*'
