[package]
name = "filter-core"
description = "iFilter の中核。保存済みポリシーを読み込み、判定エンジンへの唯一の入口を提供する"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
domain-model.workspace = true
policy-engine = { path = "../policy-engine" }
storage = { path = "../storage" }
time = { version = "0.3.45", features = ["serde", "formatting", "parsing"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"                                     # 2 プロセスが同じ DB を見る状況の再現に、ファイル実体が要る
uuid = { version = "1.24.0", features = ["v4"] }
