[package]
name = "domain-model"
description = "iFilter の共通型定義。プラットフォーム非依存で Windows / Android / サーバーが共有する"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
idna = "1.1.0"
psl = "2.1.223"
serde = { version = "1.0.229", features = ["derive"] }
time = { version = "0.3.45", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.24.0", features = ["v4", "v5", "serde"] }   # v5 は同梱ドメインの ID をドメイン名から決定的に導くため

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.151"
