<!-- アイコンの原本。ここから `npm run icon` で全サイズを作る。
     生成物（icons/）は直接編集しない。次の生成で消える。

     色は仮アイコン（256x256 の PNG）から取った値をそのまま引き継いでいる。
     意匠を変えるときはこのファイルだけを直す。

     盾は 16x16 まで縮む。**細部を足さないこと** — 縁取りや模様を入れると、
     小さいサイズで潰れて「何か青いもの」にしか見えなくなる。輪郭だけで
     読めることを、生成後に 16px を見て確かめる。 -->
