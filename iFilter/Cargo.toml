[workspace]
resolver = "3"
members = [
    "crates/domain-model",
    "crates/filter-core",
    "crates/ifilter-cli",
    "crates/policy-engine",
    "crates/storage",
    "windows/dns",
    "windows/service",
]

# Tauri アプリはこの workspace に入れない。`tauri::generate_context!` が
# ビルド時にフロントエンドの成果物（dist/）を必要とするため、UI をビルドして
# いない状態で `cargo build --workspace` が失敗してしまう。
# UI 側は `npm run verify` が自前で typecheck・lint・テストを回す。
exclude = ["apps/windows-ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["sapcework"]
license = ""

[workspace.dependencies]
domain-model = { path = "crates/domain-model" }

[workspace.lints.rust]
unsafe_code = "deny"                      # Core に unsafe は不要。windows/ 側で必要になったら個別に許可する

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }   # CI で警告ゼロを維持する（リポジトリの方針）
